name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC
  workflow_dispatch: {}
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake.svg from contribution grid
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: snake.svg

      - name: Commit snake.svg back to main
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update snake.svg [skip ci]"
          file_pattern: snake.svg
